version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       smarthome
      POSTGRES_USER:     smarthome
      POSTGRES_PASSWORD: smarthome_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile           # to be created in Week 5
    container_name: smarthome-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/smarthome
      SPRING_DATASOURCE_USERNAME: smarthome
      SPRING_DATASOURCE_PASSWORD: smarthome_secret
      JWT_SECRET:                 changeme_replace_with_256bit_secret_in_prod
      FRONTEND_ORIGIN:            http://localhost:5173
    ports:
      - "8080:8080"
    # backend service is not yet runnable — placeholder for Week 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile           # to be created in Week 10
    container_name: smarthome-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    # frontend service is not yet runnable — placeholder for Week 10

volumes:
  postgres_data:
