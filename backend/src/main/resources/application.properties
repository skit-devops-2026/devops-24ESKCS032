# ==============================================================================
# SmartHome Backend Configuration
# ==============================================================================
spring.application.name=smarthome-backend
server.port=8080

# Database Configuration (PostgreSQL with environment variable overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smarthome}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smarthome}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smarthome_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT & Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# CORS / Frontend origin
smarthome.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
