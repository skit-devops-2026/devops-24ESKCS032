name: CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # M1 — Repository hygiene
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
  # M2 / M3 — Build and test
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    needs: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install dependencies
        run: make install

      - name: Run automated test suite
        run: make test

      - name: Build project
        run: make build

  # ---------------------------------------------------------------------------
  # M5 — Containerization: Build and push production images to GHCR
  # ---------------------------------------------------------------------------
  containerize:
    name: Build and push container images (M5)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repository tags
        id: tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "frontend_tag=ghcr.io/${REPO_LOWER}-frontend:latest" >> $GITHUB_OUTPUT
          echo "frontend_sha=ghcr.io/${REPO_LOWER}-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "backend_tag=ghcr.io/${REPO_LOWER}-backend:latest" >> $GITHUB_OUTPUT
          echo "backend_sha=ghcr.io/${REPO_LOWER}-backend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.tags.outputs.frontend_tag }}
            ${{ steps.tags.outputs.frontend_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.tags.outputs.backend_tag }}
            ${{ steps.tags.outputs.backend_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Compose configuration
        run: |
          docker compose config

  # ---------------------------------------------------------------------------
  # M7 — Kubernetes: Local cluster deployment verification with Kind
  # ---------------------------------------------------------------------------
  kubernetes-test:
    name: Kubernetes verification with Kind (M7)
    needs: containerize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: smarthome-cluster

      - name: Build local container image for Kind
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${REPO_LOWER}-frontend:latest -f ./frontend/Dockerfile ./frontend
          kind load docker-image ghcr.io/${REPO_LOWER}-frontend:latest --name smarthome-cluster

      - name: Deploy Kubernetes manifests
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          # Ensure manifest references the computed repository image
          sed -i "s|ghcr.io/.*-frontend:latest|ghcr.io/${REPO_LOWER}-frontend:latest|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for Kubernetes Pods rollout
        run: |
          kubectl rollout status deployment/smarthome-frontend-deployment --timeout=120s || {
            echo "=== Pod Rollout Diagnostics ==="
            kubectl get pods -o wide
            kubectl describe pods -l app=smarthome-frontend
            kubectl logs -l app=smarthome-frontend --tail=50
            exit 1
          }

      - name: Verify Kubernetes resources
        run: |
          echo "=== Deployments ==="
          kubectl get deployments -o wide
          echo "=== Pods ==="
          kubectl get pods -o wide
          echo "=== Services ==="
          kubectl get services -o wide
          echo "=== Pod Details ==="
          kubectl describe pods -l app=smarthome-frontend
