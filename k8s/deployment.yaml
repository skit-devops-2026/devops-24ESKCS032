apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarthome-frontend-deployment
  namespace: default
  labels:
    app: smarthome-frontend
    tier: frontend
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smarthome-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: smarthome-frontend
        tier: frontend
    spec:
      containers:
        - name: smarthome-frontend
          image: ghcr.io/skit-devops-2026/devops-24eskcs032-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "80"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
