apiVersion: v1
kind: Service
metadata:
  name: smarthome-frontend-service
  namespace: default
  labels:
    app: smarthome-frontend
    tier: frontend
spec:
  type: NodePort
  selector:
    app: smarthome-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
